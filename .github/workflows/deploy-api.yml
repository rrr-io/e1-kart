name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Folder on the server with Dockerfile, compose, .env and jar (outside /srv, which is mounted into Caddy).
      API_PATH: ${{ vars.API_PATH || '/opt/e1kart-api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Also runs the tests (certificate parser and image checks, ID voting, hashing, rate limit).
      - name: Build
        run: mvn -B package

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload jar and Docker files
        run: |
          cp target/app.jar app.jar
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            app.jar Dockerfile docker-compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${API_PATH}/"

      # The jar is architecture-independent: on the server (arm64) only the runtime image gets built.
      - name: Restart container
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd ${API_PATH} && docker compose up -d --build && docker image prune -f"
